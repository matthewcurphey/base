version: 2

seeds:
  - name: ref_orginfo
    description: "Static organization reference data."

  - name: ref_calendar445
    description: "Static calendar 445 reference data."

  - name: ref_wpl
    description: "Weight per length for Castle items."

  - name: ref_opname
    description: "Maps op_code to op_name for Castle and Banner"

  - name: ref_yieldrank
    description: "Dictates which op_name yield loss is assigned to"

  - name: ref_castle_earnedhrsadjust
    description: "Manual earned hours adjustments for Castle DJ numbers"

  - name: ref_castle_includeprocesses
    description: "List which Oracle processes calculate earned hours correctly for Castle"

  - name: ref_piptargets
    description: "Targets and Payout amounts for Productivity Incentive Plan (PIP)"

  - name: ref_piptargettimings
    description: "Maps year/month to the relevant year PIP target (since we are often late and dont roll out the years targets until Feb)"

  - name: ref_pip_overrides
    description: "Manual payout_usd overrides for specific org/year/month combinations. Wins over the band-derived payout in int_castle__productivity_02_results."

  - name: banner_productivity_results
    description: "Taking Rocky's Banner productivity results for now, until we can build out the pipeline."

  - name: ref_mcmaster_daily_targets
    description: "Daily shipped-lines target per org for the McMaster target-performance tab (Chris Roeder, EVP Supply Chain & Ops, 2026-07-28). effective_from supports a target changing later without touching history — for a given org/date, the applicable target is the row with the latest effective_from <= that date. An org with no row (e.g. DAL, pending) simply has no target yet, not a target of zero."

  - name: ref_holidays
    description: "Dates treated as non-business days for target/verdict and week-average purposes across McMaster reporting, distinct from a plain zero-activity weekday (a holiday isn't 'no one tried,' a quiet Tuesday is). Currently just Christmas Day and New Year's Day as placeholders (2026-07-28) — the full observed-holiday list per branch is still pending from the business; extend this seed once that's available."