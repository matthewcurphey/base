version: 2

models:
  - name: mart_mcmaster__open_backlog
    description: "McMaster open backlog mart. Line-level detail with sale, production, item, and material availability columns. Feeds the open backlog dashboard and Excel reporting."

  - name: mart_mcmaster__cross_ship
    description: "Cross-ship opportunity mart. item x short_org x donor_org grain — trimmed from int_oracle__mcmaster_exception_cross_ship (dropped lines_coverable as redundant with lines_coverage_pct). qty_needed is what moving material would actually cost the donor to clear lines_coverage_pct of short_org's shortage; donor_overcommitted flags when multiple short orgs are competing for the same donor's surplus. Filtered to lines_coverage_pct > 0 — a donor with some stock but not enough to clear even one line isn't a real option."

  - name: mart_mcmaster__hot_components
    description: "Hot components mart. Item grain — total and per-sphere-org short line counts, open PO detail (JSON), and one avail_<org> column per non-sphere castle org (net surplus after that org's own demand), alphabetical. All 16 orgs kept, including avail_aaa (consignment inventory — genuinely useful, not a code to drop)."

  - name: mart_mcmaster__to_cancel
    description: "To-cancel exception mart (renamed from multi_shipment). McMaster order lines with so_shipment > 1 that need cancelling. Trimmed to identifiers (incl. item_clean), order/pick/credit status, order and invoice dates, customer name, and DJ status/comp_issued_qty (whether material's already been issued, which makes cancellation a reversal rather than a clean delete)."

  - name: mart_mcmaster__dj_review
    description: "DJ review exception mart (renamed from dj_status). Straight passthrough of int_castle__mcmaster_exception_dj_review — already pivoted to the exact shape needed (dj_1/2/3 + org + status, so_status label, reason_flagged text), nothing left to trim."

  - name: mart_mcmaster__backlog_daily
    description: "Backlog daily trend mart. Straight passthrough of int_castle__mcmaster_metric_backlog_daily — full history, no date trim, all columns including is_weekday/is_holiday/is_business_day kept since this will drive charts and cleanup/filtering happens at the pandas stage."

  - name: mart_mcmaster__backlog_status
    description: "Backlog status summary mart. Straight passthrough of int_oracle__mcmaster_metric_backlog_status — status x org grain, line_count and total_usd both kept; pivot to matrix/margins happens at the pandas stage."

  - name: mart_mcmaster__material_availability_daily
    description: "Incremental daily log, stamped with snapshot_date, sourced directly from int_oracle__mcmaster_02_open_backlog (line grain, so order_date is available) rather than the pre-aggregated backlog_status model. mcm_status has no date dimension of its own — it only ever reflects the live backlog/inventory position at query time — so this is the only place that position is ever preserved across days. Append-only: a day's rows, once logged, are never recomputed from a later run's (necessarily different) live state. Started logging 2026-07-28; no data exists before that date and never will. lt_bucket (in_lead_time / out_of_lead_time) splits every status by order age vs. McMaster's standard 7-day lead time — descriptive dimension, not used to gate anything downstream."

  - name: mart_mcmaster__daily_target_performance
    description: "One row per org/day: target (ref_mcmaster_daily_targets), backlog composition (no_material / with_material, the latter split with_material_in_lt / with_material_out_lt by order age vs. the 7-day lead time, plus material_availability_pct = with_material as a share of total backlog — a supply-side fact, not gated by target), actual shipped lines, and performance-to-target as continuous measures — variance_to_target and pct_to_target — rather than a Hit/Miss verdict. Daily only, no trailing-week measure. variance/pct_to_target null out when the day isn't finished yet, isn't a business day (weekend/ref_holidays), has no target set, has no material snapshot yet, or with_material itself was below target that day (a real non-judgment: if the material ceiling was already under target, shipping performance isn't what failed, so it isn't scored — the material shortfall stays visible in no_material/with_material instead of being blended into the score). Built 2026-07-28 for Chris Roeder (EVP Supply Chain & Ops)'s daily-target ask."
